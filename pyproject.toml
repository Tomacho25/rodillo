[project]
name = "rodillo"
version = "0.1.0"
description = "App open source para rodillos inteligentes (Bluetooth FTMS): rutas épicas en 3D, workouts en ERG y simulación de pendiente."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22.0",
    "pycycling>=0.4.0",
    "aiohttp>=3.10.0",
    "fitparse>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
rodillo = "rodillo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rodillo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
